<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Culture and Online Behavior</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Pure CSS radial spotlight glow using your crimson (#92140c) and base dark (#1e1e24) colors */
            background-color: #1e1e24;
            background-image: radial-gradient(circle at 50% 50%, rgba(146, 20, 12, 0.3) 0%, rgba(30, 30, 36, 0.95) 70%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        @property --angle {
            syntax: "<angle>";
            initial-value: 0deg;
            inherits: false;
        }

        /* Card Wrapper with rotating border */
        .card-wrapper {
            position: relative;
            max-width: 800px;
            width: 100%;
            border-radius: 22px;
            padding: 4px; /* Border thickness */
            
            background: conic-gradient(
                from var(--angle),
                #92140c,
                #e77c01,
                #d50303,
                #92140c
            );
            
            animation: rotateBorder 4s linear infinite;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
        }

        @keyframes rotateBorder {
            to {
                --angle: 360deg;
            }
        }

        /* Inner container card */
        .container {
            background-color: rgba(30, 30, 36, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 18px;
            padding: 3.5rem 2.5rem;
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5rem;
        }

        h1 {
            color: #fff8f0;
            font-size: 2.8rem;
            font-weight: 800;
            line-height: 1.3;
            letter-spacing: -0.02em;
        }

        /* Styling for the highlighted text spans */
        h1 span {
            color: #92140c;
            background: rgba(146, 20, 12, 0.2);
            padding: 0.1em 0.3em;
            border-radius: 8px;
            border: 1px solid rgba(146, 20, 12, 0.4);
            display: inline-block;
        }

        p {
            color: #fff8f0;
            font-size: 1.15rem;
            opacity: 0.85;
            max-width: 600px;
            line-height: 1.6;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        /* Interactive button styling */
        button {
            background-color: #92140c;
            font-size: 20px;
            font-weight: 700;
            color: #fff8f0;
            border: 2px solid #fff8f0;
            border-radius: 12px;
            width: 280px;
            height: 55px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(146, 20, 12, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Hover & Click Effects */
        button:hover {
            background-color: #fff8f0;
            color: #92140c;
            border-color: #92140c;
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(255, 248, 240, 0.2);
        }

        button:active {
            transform: translateY(1px);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>
    <div class="card-wrapper">
        <div class="container">
            <h1><span>DIGITAL CULTURE</span> AND <span>ONLINE BEHAVIOR</span></h1>
            <p>Group 4: Memes, Virality, and Influencers</p>
            <a href="firstPage.html"><button>Start</button></a>
            <a href="icebreak.html"><button>Ice break</button></a>
        </div>
    </div>
</body>
</html>
